<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>비레스 5083 이야기 서고</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="review.css?v=20260802-2">
</head>
<body>
  <header class="review-topbar">
    <a class="brand-link" href="#story-starts" aria-label="이야기 서고 시작 장면으로 이동">
      <img src="assets/icons/library-big.svg" alt="">
      <span>
        <span class="brand-kicker">VIRETH 5083</span>
        <strong>이야기 서고</strong>
      </span>
    </a>
    <div class="topbar-actions">
      <span id="saveStatus" class="save-status" aria-live="polite">읽은 이야기 확인 중</span>
      <a class="start-link" href="#story-starts">
        <img src="assets/icons/compass.svg" alt="">
        <span>장면 고르기</span>
      </a>
    </div>
  </header>

  <main class="review-shell">
    <section class="archive-stage" aria-labelledby="archiveTitle">
      <img class="stage-background" src="assets/archive-stage/vireth-city-stage.webp" alt="비레스의 들판과 마을, 장터가 이어진 풍경">
      <div class="stage-copy">
        <p class="eyebrow">VIRETH 5083 STORY ARCHIVE</p>
        <h1 id="archiveTitle">내 시작상황과 이어지는 이야기를 읽어보세요.</h1>
        <p class="stage-description">편지, 장부, 공문과 사건 기록 속에서 비레스의 이름과 생활 방식을 알아갈 수 있습니다.</p>
        <div class="overall-progress" aria-label="전체 읽기 진행">
          <div class="progress-copy">
            <img src="assets/icons/book-open.svg" alt="">
            <span id="overallProgressLabel">0 / 8 장면 읽기 완료</span>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="overallProgressBar"></span></div>
        </div>
      </div>

    </section>

    <section id="story-starts" class="story-starts" aria-labelledby="storyStartsTitle">
      <div class="starts-heading">
        <div>
          <p class="section-kicker">CHOOSE YOUR OPENING</p>
          <h2 id="storyStartsTitle">어떤 장면에서 이야기를 시작할까요?</h2>
          <p>마음에 드는 장면을 고르면 그 상황과 맞닿은 네 편을 바로 읽을 수 있습니다.</p>
        </div>
        <span class="starts-count">8개의 시작</span>
      </div>
      <nav id="scenarioList" class="scenario-list" role="tablist" aria-label="이야기 시작 장면"></nav>
    </section>

    <section id="scenarioView" class="scenario-view" aria-live="polite"></section>
  </main>

  <noscript>이야기 서고를 사용하려면 브라우저에서 JavaScript를 허용해야 합니다.</noscript>
  <script src="public-reading-data.js?v=20260802-2"></script>
  <script src="review.js?v=20260802-2"></script>
</body>
</html>
